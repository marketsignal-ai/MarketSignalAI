<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Signal AI</title>

    <link rel="stylesheet" href="style.css"> </head>

<body>
    <div class="container">

    <h1>📈 Market Signal AI</h1>

    <div class="card weather-card">

        <h2>☀️ 市場の天気</h2>

        <div class="weather" id="weather">
            ☀️晴れ
        </div>

        <div class="risk" id="risk">
            市場リスク：低
        </div>

    </div>

    <div class="card">
        <h2>市場データ</h2>

        <p id="sp500">S&P500：---</p>
        <p id="nasdaq100">NASDAQ100：---</p>
        <p id="vix">VIX：---</p>
        <p id="usdjpy">ドル円：---</p>
        <p id="sp500_200ma">S&P500 200日移動平均：---</p>
        <p id="sp500_200ma_diff">200日線乖離率：---</p>
    </div>
 
    <div class="card">

        <h3>✅ 今週の行動</h3>

        <p>積立継続</p>

        <p>売却不要</p>

    </div>

    <div class="card">

        <h3>📊 市場状況</h3>

        <p>🟢 市場トレンド</p>

        <p>🟢 市場心理</p>

        <p>🟢 景気</p>

        <p>🟢 為替</p>

    </div>

    <div class="card">

        <h3>🤖 AIコメント</h3>

        <p>

市場は健全です。<br>

今週は何もしなくて大丈夫です。

        </p>

    </div>

    <div class="card">
        <h3>🧪 テスト</h3>

        <button onclick="changeWeather('sunny')">☀️ 晴れ</button>

        <button onclick="changeWeather('cloudy')">☁️ 曇り</button>

        <button onclick="changeWeather('rain')">🌧 雨</button>
    </div>

</div>

    <script src="script.js"></script>

</body>
</html>
