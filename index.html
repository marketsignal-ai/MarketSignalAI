<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Signal AI</title>

    <link rel="stylesheet" href="style.css"> </head>

<body>
    <div class="container">

    <h1>📈 Market Signal AI</h1>

    <div class="card weather-card">

        <h2>☀️ 市場の天気</h2>

        <div class="weather">
            晴れ
        </div>

        <div class="risk">
            市場リスク：低
        </div>

    </div>

    <div class="card">

        <h3>✅ 今週の行動</h3>

        <p>積立継続</p>

        <p>売却不要</p>

    </div>

    <div class="card">

        <h3>📊 市場状況</h3>

        <p>🟢 市場トレンド</p>

        <p>🟢 市場心理</p>

        <p>🟢 景気</p>

        <p>🟢 為替</p>

    </div>

    <div class="card">

        <h3>🤖 AIコメント</h3>

        <p>

市場は健全です。<br>

今週は何もしなくて大丈夫です。

        </p>

    </div>

</div>

    <script src="script.js"></script>

</body>
</html>
