name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"

jobs:
  update-market:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get market data from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          api_key = os.environ["FRED_API_KEY"]

          def get_series(series_id, limit=10):
              params = urllib.parse.urlencode({
                  "series_id": series_id,
                  "api_key": api_key,
                  "file_type": "json",
                  "sort_order": "desc",
                  "limit": limit
              })

              url = (
                  "https://api.stlouisfed.org/"
                  "fred/series/observations?"
                  + params
              )

              with urllib.request.urlopen(url) as response:
                  data = json.load(response)

              values = []

              for obs in data.get("observations", []):
                  value = obs.get("value")

                  if value and value != ".":
                      values.append(float(value))

              if not values:
                  raise RuntimeError(
                      f"{series_id} data could not be obtained: {data}"
                  )

              return values


          # =========================
          # 市場データ取得
          # =========================

          sp500_history = get_series(
              "SP500",
              300
          )

          nasdaq100_history = get_series(
              "NASDAQ100",
              10
          )

          vix_history = get_series(
              "VIXCLS",
              10
          )

          usdjpy_history = get_series(
              "DEXJPUS",
              10
          )

          yield_curve_history = get_series(
              "T10Y2Y",
              10
          )

          high_yield_history = get_series(
              "BAMLH0A0HYM2",
              10
          )

          initial_claims_history = get_series(
              "ICSA",
              10
          )


          # =========================
          # 最新値
          # =========================

          sp500 = sp500_history[0]
          nasdaq100 = nasdaq100_history[0]
          vix = vix_history[0]
          usdjpy = usdjpy_history[0]
          yield_curve = yield_curve_history[0]
          high_yield_spread = high_yield_history[0]
          initial_claims = initial_claims_history[0]


          # =========================
          # 前日値
          # =========================

          if len(sp500_history) < 2:
              raise RuntimeError(
                  "Not enough S&P500 history"
              )

          if len(vix_history) < 2:
              raise RuntimeError(
                  "Not enough VIX history"
              )

          if len(high_yield_history) < 2:
              raise RuntimeError(
                  "Not enough High Yield history"
              )

          sp500_prev = sp500_history[1]
          vix_prev = vix_history[1]
          high_yield_prev = high_yield_history[1]


          # =========================
          # 前日比・前日差
          # =========================

          sp500_daily_change = (
              (sp500 / sp500_prev) - 1
          ) * 100

          vix_daily_change = (
              (vix / vix_prev) - 1
          ) * 100

          high_yield_daily_change = (
              high_yield_spread
              - high_yield_prev
          )


          # =========================
          # S&P500 200日移動平均
          # =========================

          if len(sp500_history) < 200:
              raise RuntimeError(
                  "Not enough S&P500 data "
                  "for 200-day average"
              )

          sp500_200ma = (
              sum(sp500_history[:200])
              / 200
          )

          sp500_200ma_diff = (
              (sp500 / sp500_200ma - 1)
              * 100
          )


          # =========================
          # 急変スコア
          # 0～6点
          # =========================

          sudden_score = 0

          # S&P500下落
          if sp500_daily_change <= -3:
              sudden_score += 2
          elif sp500_daily_change <= -2:
              sudden_score += 1

          # VIX急上昇
          if vix_daily_change >= 30:
              sudden_score += 2
          elif vix_daily_change >= 15:
              sudden_score += 1

          # 信用スプレッド急拡大
          if high_yield_daily_change >= 0.50:
              sudden_score += 2
          elif high_yield_daily_change >= 0.25:
              sudden_score += 1


          # =========================
          # market.json 読み込み
          # =========================

          with open(
              "market.json",
              "r",
              encoding="utf-8"
          ) as f:
              market = json.load(f)


          # =========================
          # market.json 更新
          # =========================

          market["sp500"] = round(
              sp500,
              2
          )

          market["nasdaq100"] = round(
              nasdaq100,
              2
          )

          market["vix"] = round(
              vix,
              2
          )

          market["usdjpy"] = round(
              usdjpy,
              2
          )

          market["sp500_200ma"] = round(
              sp500_200ma,
              2
          )

          market["sp500_200ma_diff"] = round(
              sp500_200ma_diff,
              2
          )

          market["yield_curve"] = round(
              yield_curve,
              2
          )

          market["high_yield_spread"] = round(
              high_yield_spread,
              2
          )

          market["initial_claims"] = int(
              initial_claims
          )

          market["sp500_daily_change"] = round(
              sp500_daily_change,
              2
          )

          market["vix_daily_change"] = round(
              vix_daily_change,
              2
          )

          market["high_yield_daily_change"] = round(
              high_yield_daily_change,
              2
          )

          market["sudden_score"] = sudden_score


          # =========================
          # market.json 保存
          # =========================

          with open(
              "market.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  market,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================
          # 確認用ログ
          # =========================

          print(
              "S&P500:",
              market["sp500"]
          )

          print(
              "NASDAQ100:",
              market["nasdaq100"]
          )

          print(
              "VIX:",
              market["vix"]
          )

          print(
              "USDJPY:",
              market["usdjpy"]
          )

          print(
              "S&P500 200MA:",
              market["sp500_200ma"]
          )

          print(
              "S&P500 vs 200MA:",
              market["sp500_200ma_diff"],
              "%"
          )

          print(
              "10Y-2Y:",
              market["yield_curve"],
              "%"
          )

          print(
              "High Yield Spread:",
              market["high_yield_spread"],
              "%"
          )

          print(
              "Initial Claims:",
              market["initial_claims"]
          )

          print(
              "S&P500 Daily Change:",
              market["sp500_daily_change"],
              "%"
          )

          print(
              "VIX Daily Change:",
              market["vix_daily_change"],
              "%"
          )

          print(
              "High Yield Daily Change:",
              market["high_yield_daily_change"],
              "%"
          )

          print(
              "Sudden Score:",
              market["sudden_score"],
              "/ 6"
          )

          PY


      - name: Install pandas
        run: pip install pandas

      - name: Update Major Crash Risk V2
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_major_crash_v2.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push