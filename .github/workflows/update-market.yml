name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"

jobs:
  update-market:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get market data
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          api_key = os.environ["ALPHA_VANTAGE_API_KEY"]

          # -------------------------
          # SPY
          # -------------------------
          spy_params = urllib.parse.urlencode({
              "function": "GLOBAL_QUOTE",
              "symbol": "SPY",
              "apikey": api_key
          })

          spy_url = "https://www.alphavantage.co/query?" + spy_params

          with urllib.request.urlopen(spy_url) as response:
              spy_data = json.load(response)

          spy_quote = spy_data.get("Global Quote", {})
          spy_price = spy_quote.get("05. price")

          if not spy_price:
              raise RuntimeError(f"SPY data could not be obtained: {spy_data}")

          # -------------------------
          # USD / JPY
          # -------------------------
          fx_params = urllib.parse.urlencode({
              "function": "CURRENCY_EXCHANGE_RATE",
              "from_currency": "USD",
              "to_currency": "JPY",
              "apikey": api_key
          })

          fx_url = "https://www.alphavantage.co/query?" + fx_params

          with urllib.request.urlopen(fx_url) as response:
              fx_data = json.load(response)

          fx_quote = fx_data.get("Realtime Currency Exchange Rate", {})
          usd_jpy = fx_quote.get("5. Exchange Rate")

          if not usd_jpy:
              raise RuntimeError(f"USD/JPY data could not be obtained: {fx_data}")

          # -------------------------
          # market.json 更新
          # -------------------------
          with open("market.json", "r", encoding="utf-8") as f:
              market = json.load(f)

          market["sp500"] = round(float(spy_price), 2)
          market["usdjpy"] = round(float(usd_jpy), 2)

          with open("market.json", "w", encoding="utf-8") as f:
              json.dump(market, f, ensure_ascii=False, indent=2)

          print("SPY:", market["sp500"])
          print("USDJPY:", market["usdjpy"])
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push