name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"

jobs:
  update-market:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get market data from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          api_key = os.environ["FRED_API_KEY"]

          def get_series(series_id, limit=10):
              params = urllib.parse.urlencode({
                  "series_id": series_id,
                  "api_key": api_key,
                  "file_type": "json",
                  "sort_order": "desc",
                  "limit": limit
              })

              url = "https://api.stlouisfed.org/fred/series/observations?" + params

              with urllib.request.urlopen(url) as response:
                  data = json.load(response)

              values = []

              for obs in data.get("observations", []):
                  value = obs.get("value")
                  if value and value != ".":
                      values.append(float(value))

              if not values:
                  raise RuntimeError(
                      f"{series_id} data could not be obtained: {data}"
                  )

              return values

          # 最新値
          sp500 = get_series("SP500", 10)[0]
          nasdaq100 = get_series("NASDAQ100", 10)[0]
          vix = get_series("VIXCLS", 10)[0]
          usdjpy = get_series("DEXJPUS", 10)[0]

          # S&P500 200日移動平均
          # 休日などの欠損を考えて300件取得
          sp500_history = get_series("SP500", 300)

          if len(sp500_history) < 200:
              raise RuntimeError(
                  f"Not enough S&P500 data for 200-day average: "
                  f"{len(sp500_history)} observations"
              )

          sp500_200ma = sum(sp500_history[:200]) / 200

          # market.json 読み込み
          with open("market.json", "r", encoding="utf-8") as f:
              market = json.load(f)

          # 更新
          market["sp500"] = round(sp500, 2)
          market["nasdaq100"] = round(nasdaq100, 2)
          market["vix"] = round(vix, 2)
          market["usdjpy"] = round(usdjpy, 2)
          market["sp500_200ma"] = round(sp500_200ma, 2)

          # 200日線との乖離率
          market["sp500_200ma_diff"] = round(
              ((sp500 / sp500_200ma) - 1) * 100,
              2
          )

          with open("market.json", "w", encoding="utf-8") as f:
              json.dump(
                  market,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("S&P500:", market["sp500"])
          print("NASDAQ100:", market["nasdaq100"])
          print("VIX:", market["vix"])
          print("USDJPY:", market["usdjpy"])
          print("S&P500 200MA:", market["sp500_200ma"])
          print(
              "S&P500 vs 200MA:",
              market["sp500_200ma_diff"],
              "%"
          )
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push