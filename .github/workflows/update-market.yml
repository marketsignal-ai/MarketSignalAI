name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"

jobs:
  update-market:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get S&P500 from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          api_key = os.environ["FRED_API_KEY"]

          params = urllib.parse.urlencode({
              "series_id": "SP500",
              "api_key": api_key,
              "file_type": "json",
              "sort_order": "desc",
              "limit": 10
          })

          url = "https://api.stlouisfed.org/fred/series/observations?" + params

          with urllib.request.urlopen(url) as response:
              data = json.load(response)

          observations = data.get("observations", [])

          sp500_value = None

          for obs in observations:
              value = obs.get("value")
              if value and value != ".":
                  sp500_value = float(value)
                  break

          if sp500_value is None:
              raise RuntimeError(f"S&P500 data could not be obtained: {data}")

          with open("market.json", "r", encoding="utf-8") as f:
              market = json.load(f)

          market["sp500"] = round(sp500_value, 2)

          with open("market.json", "w", encoding="utf-8") as f:
              json.dump(market, f, ensure_ascii=False, indent=2)

          print("S&P500:", market["sp500"])
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push