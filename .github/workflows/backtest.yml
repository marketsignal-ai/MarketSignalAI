name: Run Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backtest.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_results_v11.csv