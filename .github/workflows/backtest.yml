name: Run Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Run backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backtest.py

      - name: Run strategy backtest
        run: python strategy_backtest.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: long-backtest-results
          path: |
            long_backtest_results.csv
            crisis_snapshots.csv
            strategy_comparison_v2.csv
            strategy_trades_v2.csv
            blocked_signals_v2.csv
            crisis_strategy_trades_v2.csv